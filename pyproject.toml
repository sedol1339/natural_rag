[project]
name = "natural_rag"
version = "0"
requires-python = ">=3.12"

dependencies = [
    "pydantic",
    # sentence-transformers 6.x requires transformers>=5, which breaks the
    # pinned vLLM stack (tokenizer attribute removed in transformers 5) —
    # see the wikontic extra's transformers>=4.40,<5 pin.
    "sentence-transformers>=3.0,<6",
    "ipykernel",
    "ipywidgets",
    # openai не пинится в базе: движкам нужны разные мажоры (RAGU — <3,
    # fast-graphrag/hipporag — 1.x). Пин RAGU живёт в его extra.
    "openai",
    "httpx[socks]", # if using HTTP_PROXY with sentence_transformers
    "bigtree",
    "dash>=4.0.0",
    "dash-bootstrap-components>=2.0.4",
]

[project.optional-dependencies]
# ── RAGU (default / primary engine) ─────────────────────────────────
# Our own GraphRAG engine. Preferred and used by most run scripts.
# Repository: https://github.com/RaguTeam/RAGU
ragu = [
    "graph-ragu @ git+https://github.com/RaguTeam/RAGU.git",
    # RAGU (0.0.3 и dev) патчит openai._utils._logs.httpx_logger при импорте;
    # в openai>=3 атрибут удалён → AttributeError на любом билде RAGU.
    "openai>=2.21.0,<3",
]

# ── RAGU, dev branch ───────────────────────────────────────────────
# Same engine from the unreleased branch. Install INSTEAD of [ragu], never
# alongside it: both provide the package `ragu`, and pip keeps whichever it
# resolved last. The dev branch passes retrieval options as an EngineParams
# object rather than top_k/use_chunks keywords; RAGUPipeline detects which
# convention the installed build uses, so both work unchanged.
#
# NOT an extra: two git URLs for one package cannot coexist in a single uv
# lock, so a `ragu-dev` extra made `uv lock` fail outright. Install manually:
#   pip install -e . && pip install --force-reinstall \
#       "graph-ragu @ git+https://github.com/RaguTeam/RAGU.git@dev"

# ── Baseline (tree-based RAG without a graph) ──────────────────────
# A simple tree-structured baseline. Depends on RAGU for LLM & caching.
baseline = [
    "natural_rag[ragu]",
    "diskcache>=5.6.3",
]

# ── LightRAG ───────────────────────────────────────────────────────
# Minimal, fast GraphRAG implementation from HKU.
# PyPI: lightrag-hku  |  Import: lightrag
lightrag = [
    "lightrag-hku>=1.4.12",
    "numpy>=1.26.0",
]

# ── NanoGraphRAG ──────────────────────────────────────────────────
# Minimal, hackable GraphRAG (predecessor of LightRAG).
# PyPI: nano-graphrag  |  Import: nano_graphrag
nano-graphrag = [
    "nano-graphrag>=0.0.8",
    "numpy>=1.26.0",
]

# ── FastGraphRAG ──────────────────────────────────────────────────
# High-performance GraphRAG by Circlemind.
# PyPI: fast-graphrag  |  Import: fast_graphrag
fast-graphrag = [
    "fast-graphrag>=0.0.5",
    "instructor>=1.3.0",
    "aiohttp>=3.9.0",
]

# ── HippoRAG ──────────────────────────────────────────────────────
# Long-term-memory-inspired RAG with knowledge graphs (NeurIPS 2024).
# PyPI: hipporag  |  Import: hipporag
# NOTE: pulls in torch, transformers, vllm, etc. — large install.
hipporag = [
    "hipporag>=2.0.0a2",
]

# ── Wikontic ──────────────────────────────────────────────────────
# Wikidata-aligned, ontology-aware KG construction pipeline (EACL 2026 / AAAI DEMO 26).
# Repository: https://github.com/screemix/Wikontic
# NOTE: pulls in torch, transformers, etc. — large install. GPU recommended.
wikontic = [
    "wikontic @ git+https://github.com/XieN-N/Wikontic.git@add-wikonticdb-to-packages",
    "torch>=2.4.0",
    # transformers 5 validates model configs through huggingface_hub's strict
    # dataclasses and rejects GigaChat's config.json ("routed_scaling_factor
    # expected float, got int"). 4.x has no such check.
    "transformers>=4.40,<5",
    "qdrant-client>=1.12.0",
    "pymongo>=4.8",
    "python-dotenv",
]

# ── All engines (convenience meta-package) ─────────────────────────
# НЕ включает fast-graphrag (пинит tiktoken<0.9 против tiktoken>=0.11 у
# актуального graph-ragu) и hipporag (пинит openai==1.x против нашего
# openai<3): в одном окружении с RAGU они не разрешаются. Движки и так
# принято разводить по отдельным env (как на кластере) — ставьте их
# отдельными extras в своих окружениях.
all = [
    "natural_rag[ragu]",
    "natural_rag[baseline]",
    "natural_rag[lightrag]",
    "natural_rag[nano-graphrag]",
    "natural_rag[wikontic]",
]

# RAGU (openai<3) несовместим по openai/tiktoken с fast-graphrag (openai<2,
# tiktoken<0.9) и hipporag (openai==1.x): это форки версий — uv умеет их
# разводить через conflicts, но одновременно ставить нельзя; движки и так
# приняты в отдельных окружениях (как на кластере).
[tool.uv]
conflicts = [
    [
        { extra = "ragu" },
        { extra = "fast-graphrag" },
    ],
    [
        { extra = "ragu" },
        { extra = "hipporag" },
    ],
    # baseline и all тянут ragu, поэтому в ветках fast-graphrag/hipporag
    # их тоже нужно исключить.
    [
        { extra = "baseline" },
        { extra = "fast-graphrag" },
    ],
    [
        { extra = "baseline" },
        { extra = "hipporag" },
    ],
    [
        { extra = "all" },
        { extra = "fast-graphrag" },
    ],
    [
        { extra = "all" },
        { extra = "hipporag" },
    ],
    # и между собой: hipporag пинит tiktoken==0.7, fast-graphrag — 0.8.x.
    [
        { extra = "fast-graphrag" },
        { extra = "hipporag" },
    ],
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["natural_rag*"]
exclude = ["logs*", "runs*", "runs_cluster*", "runs_local*", "legacy*", "datasets*", "generated*", "notebooks*", "docs*"]
